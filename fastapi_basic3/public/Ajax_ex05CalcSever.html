<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Path Parameter</title>
</head>
<body>
    <h1>초등학교 저학년 사칙연산 계산기</h1>
    항1: <input type="text" id="a" value="10"><br>
    항2: <input type="text" id="b" value="3"><br>
    연산자: <select id="oper">
        <option value="plus">+</option>
        <option value="min">-</option>
        <option value="mult">*</option>
        <option value="div">/</option>
    </select>

    <button id="btn">계산</button>

    <div id="result">결과: </div>

    <script>
        console.log("XMLHttpRequest Ajax 계산기 시작");

        var BASE_URL = "http://127.0.0.1:8000";

        // btn을 클릭하면 항1, 항2의 값을 서버에 전송하고 결과값을 돌려 받기
        var inputA = document.getElementById("a")
        var inputB = document.getElementById("b")
        var selectOper = document.getElementById("oper")
        var buttonBtn = document.getElementById("btn")

        var divResult = document.getElementById("result");

        buttonBtn.onclick = function(enent) {
            // 1. 값 가져오기
            var a = inputA.value
            var b = inputB.value
            var oper = selectOper.value

            console.log("버튼 눌림", a, b, oper)


            // 오늘 배운 Ajax를 이용해서 FastAPI 서버와 통신되는 기능 구현
            // url을 만들어서 서버에 요청
            // 요청 결과를 화면에 출력

            // Ajax 객체 생성
            var xhttp = new XMLHttpRequest();

            // 요청 준비
            var url = BASE_URL + "/" + oper + "/" + Number(a) + "/" + Number(b)
            xhttp.open("GET", url, true);

            // 응답 처리
            xhttp.onload = function() {
                if(xhttp.status==200) {
                    console.log(xhttp.responseText);

                    // JSON 문자열
                    // Javascript의 Object는 파이썬의 Dict와 유사하다.
                    resultObj = JSON.parse(xhttp.responseText);
                    console.dir(resultObj["a"], resultObj.b, resultObj.result );

                    // divResult.textContent = "결과: " + xhttp.responseText;

                    // divResult에 innerText 속성을 이용해서 결과 출력
                    divResult.innerHTML = `<h3>결과: 
                        ${resultObj.a}${resultObj["oper"]}${resultObj.b}=${resultObj.result}
                        <h3>`
                }
            }

            // 요청 전송
            xhttp.send();
                   
        }; // 함수 종료
    </script>
</body>
</html>
