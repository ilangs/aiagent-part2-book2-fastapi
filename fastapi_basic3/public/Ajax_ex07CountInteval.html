<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI server counter</title>
</head>
<body>
    <h1>FastAPI 서버 카운터</h1>

    <div id="result">결과 대기 중 ...</div>
    <button id="btn">다시 요청</button>

    <script>

        var xhr = new XMLHttpRequest();
        var result = document.getElementById("result")
        var btn = document.getElementById("btn")

        // 함수 선언 방법
        // function 함수명() { 처리문; }

        // 변수를 함수에 저장 (참조)
        // 다른 함수의 매개변수에 함수 전달 가능 (콜백함수)
        // 자바스크립트는 콜백함수를 많이 사용 한다.
        var requestCount = function(e) {
            // 페이지가 모두 브라우저에 로드되면,
            // Ajax를 이용해서 서버에 요청

            // Javascript에서는 함수 내부에 다른 함수 선업 가능
            xhr.onload = function(e) {
                obj = JSON.parse(xhr.responseText);
                result.innerHTML = `
                    <ul>
                        <li>date: ${obj.datestr}</li>
                        <li>count: ${obj.count}</li>
                    </ul>
                `;
            }
            xhr.open("GET", "http://127.0.0.1:8000/count", true)
            xhr.send();
        }
        
        //선언한 함수를 재활용한다.
        window.onload = function(e) {
                requestCount(e)
        }

        // 버튼을 클릭하면 count 객체를 다시 로드한다.
        btn.onclick = function(e) {
                requestCount(e)
        }

        var client_cnt = 0;
        // 1초에 한번씩 서버의 cnt 체크하기
        // 1초에 한번씩 호출되는 함수 선언 : setInterval(), set Timeout()
        // 시간차를 주기 위한 함수
        setInterval(function() {
            client_cnt += 1;
            console.log("Hello", client_cnt);

            // client_cnt를 서버에 보내서 서버 cnt 변경 check하기
                xhr.onload = function(e) {
                obj = JSON.parse(xhr.responseText);
                result.innerHTML = `
                    <ul>
                        <li>date: ${obj.datestr}</li>
                        <li>count: ${obj.count}</li>
                    </ul>
                `;

                if(obj != null && obj.count > client_cnt) {
                    client_cnt = obj,count;
                }
            }

        }, 1000)

    </script>
</body>
</html>
