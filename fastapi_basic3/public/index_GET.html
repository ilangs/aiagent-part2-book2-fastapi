<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI</title>
</head>
<body>
    <h1>사칙연산 계산기</h1>

    숫자 1: <input type="number" id="a" value="10" required><br>
    숫자 2: <input type="number" id="b" value="3" required><br>
    
    연산자: 
    <select id="oper">
        <option value="add"> + </option>
        <option value="sub"> - </option>
        <option value="mul"> x </option>
        <option value="div"> / </option>
    </select>

    <button id="btn">계산</button>

    <div id="result">결과:</div>
    <script>
        
        var Base_url = "http://127.0.0.1:8000";

        var inputA = document.getElementById("a");
        var inputB = document.getElementById("b");
        var selectOper = document.getElementById("oper");
        var buttonBtn = document.getElementById("btn");
        
        var divResult= document.getElementById("result");

        buttonBtn.onclick = function() {
            var a = inputA.value;
            var b = inputB.value;
            var oper = selectOper.value;

            console.log("Button Click!", a, oper, b)

            // 숫자 검증
            if (a === "" || b === "" || isNaN(a) || isNaN(b)) {
                divResult.innerText = "숫자만 입력하세요.";
                return;
            }

            // url 구성
            var url = `${Base_url}/calc/${oper}/${a}/${b}`
            console.log("요청 url", url) 

            // Ajax 객체 생성 및 요청 준비
            var xhr = new XMLHttpRequest();
            xhr.open("GET", url, true);

            // 응답처리
            xhr.onload = function () {
                if (xhr.status===200) {
                    console.log("서버 응답: ", xhr.responseText);
                    divResult.textContent = "결과: " + xhr.responseText;
                }
                else {
                    console.error("서버오류:", xhr.status);
                    divResult.textContent = xhr.responseText;
                }
            };
            // 요청 전송
            xhr.send();
        };
    </script>
</body>
</html>
